<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Musica</title>
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://unpkg.com/axios"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lucida Sans', sans-serif; }
        .container {
            min-height: 100vh;
            padding: 20px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .song-title {
            font-size: 4em;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            max-width: 80%;
            word-wrap: break-word;
        }
        audio {
            width: 100%;
            max-width: 1200px;
            height: 100px;
            margin-top: 20px;
        }
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        /* --- STYLES POUR LES BOUTONS RONDS (PLAY/PAUSE, NEXT) --- */
        .btn {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin: 15px;
            border: 4px solid;
            border-color: inherit; /* Prend la couleur du texte, s'adapte dynamiquement */
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .btn:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
        /* --- FIN DES STYLES POUR .btn --- */

        .section-title {
            font-size: 2.5em;
            margin: 40px 0 20px;
            width: 100%;
        }

        .radio-btn {
            font-size: 2em;
            padding: 20px 40px;
            margin: 10px auto; /* Centre horizontalement */
            border-radius: 12px;
            cursor: pointer;
            display: block;
            border: 3px solid rgba(0,0,0,0.3);
            max-width: 80%;
        }

        .stats {
            margin-top: 40px;
            font-size: 1.2em;
            font-style: italic;
            width: 100%;
        }
        .stats p {
            color: black; /* Applique la couleur à la phrase */
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container" :style="{backgroundColor:bgColor, backgroundImage:bgImage, color:textColor}">
            <h1 class="song-title">{{songName}}</h1>
            <!-- Le lecteur audio principal -->
            <!-- L'attribut 'autoplay' a été retiré car il est souvent bloqué par les navigateurs -->
            <audio ref="player" :src="songUrl" controls @ended="nextSong"></audio>

            <div class="section-title">M U $ I C</div>
            <div class="controls">
                <!-- Bouton Play/Pause qui affiche le symbole ▶ ou ⏸ dynamiquement -->
                <button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="togglePlay">
                    {{ player.paused ? '▶' : '⏸' }}
                </button>
                
                <!-- Bouton Next avec les chevrons -->
                <button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="nextSong">
                    &gt;&gt;
                </button>
            </div>

            <!-- Section Radio -->
            <div class="section-title">R A D I O</div>
            <div>
                <audio ref="radioFip" src="https://direct.fipradio.fr/live/fip-midfi.mp3"></audio>
                <button class="radio-btn" style="background-color:#2233FF;color:white" @click="toggleRadio('fip')">{{radios.fip?'⏸':'▶'}} FIP Radio</button>
            </div>
            <div>
                <audio ref="radioCulture" src="https://direct.franceculture.fr/live/franceculture-midfi.mp3"></audio>
                <button class="radio-btn" style="background-color:#F32;color:white" @click="toggleRadio('culture')">{{radios.culture?'⏸':'▶'}} France Culture</button>
            </div>

            <!-- Section Stats (uniquement la phrase) -->
            <div class="stats">
                <p>cé mizik an nou ki pli bel ®</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    songName: '',
                    songUrl: '', // URL de la chanson venant de l'API
                    bgColor: '#000',
                    textColor: '#FFF',
                    bgImage: '',
                    player: {
                        paused: true // État pour le bouton Play/Pause
                    },
                    radios: { fip: false, culture: false },
                    stats: { totalHits: 0, sessionPlayed: 0, totalSongs: 0 }
                };
            },
            async mounted() {
                // Charge les stats globales (totalHits, totalSongs)
                await this.loadStats();
                // Charge les infos de la première chanson, mais ne la joue pas automatiquement
                // La lecture sera déclenchée par le premier clic utilisateur sur Play/Pause.
                await this.nextSong();
            },
            methods: {
                async nextSong() {
                    try {
                        // Appel API pour obtenir les infos de la chanson depuis le backend
                        // Assurez-vous que l'URL est absolue et correcte
                        const r = await axios.get('https://musica.zapto.org/api/next-song', { withCredentials: true });
                        
                        this.songName = r.data.songName;
                        this.songUrl = r.data.url; // URL absolue fournie par le backend
                        this.bgColor = r.data.color;
                        this.textColor = r.data.textColor;
                        this.bgImage = `url('${r.data.cover}')`; // URL absolue fournie par le backend

                        // Réinitialise l'état du joueur pour afficher '▶' lors du chargement d'une nouvelle chanson
                        this.player.paused = true; 
                        
                        // Recharge les stats (pour totalHits, etc.)
                        await this.loadStats();

                    } catch (e) {
                        console.error("Erreur lors du chargement de la prochaine chanson:", e);
                        alert("Impossible de charger la prochaine chanson. Veuillez réessayer.");
                    }
                },
                
                // Gère le clic sur le bouton Play/Pause
                togglePlay() {
                    const p = this.$refs.player; // Récupère l'élément audio

                    // Vérification si l'URL de la chanson est définie avant de tenter de jouer
                    if (!this.songUrl) {
                        alert("Aucune chanson chargée. Cliquez sur Next pour en charger une.");
                        return;
                    }

                    if (this.player.paused) { // Si actuellement en pause
                        p.play()
                         .then(() => {
                             // Lecture démarrée avec succès
                             this.player.paused = false; // Met à jour l'état pour afficher '⏸'
                             // Incrémente les hits globaux (totalHits) SEULEMENT si la lecture démarre
                             this.incrementHits(); 
                         })
                         .catch(e => {
                             // Erreur lors de la lecture (bloquée par le navigateur, URL invalide, fichier corrompu, CORS)
                             console.error("Erreur lors de la lecture de la chanson:", e);
                             // Affiche un message plus général si la cause n'est pas une restriction navigateur
                             if (e.name === "NotSupportedError" || e.message.includes("no supported sources")) {
                                 alert("Erreur de format audio ou fichier introuvable. Vérifiez que le lien est correct et que le fichier est lisible.");
                             } else {
                                 alert("Lecture audio non autorisée ou erreur de lecture. Essayez d'abord de cliquer sur Play.");
                             }
                         });
                    } else { // Si actuellement en lecture
                        p.pause(); // Met en pause
                        this.player.paused = true; // Met à jour l'état pour afficher '▶'
                    }
                },
                
                // Bouton Next, appelle la méthode nextSong
                nextSong() {
                    this.nextSong(); 
                },

                // Gère les radios
                toggleRadio(n) {
                    const refs = { fip: 'radioFip', culture: 'radioCulture' };
                    const p = this.$refs[refs[n]]; // Récupère l'élément audio de la radio

                    if (p.paused) {
                        p.play().then(() => {
                            this.radios[n] = true; // Met à jour l'état pour afficher '⏸'
                        }).catch(e => {
                            console.error(`Erreur lors de la lecture de la radio ${n}:`, e);
                            alert(`Impossible de lire la radio ${n}.`);
                        });
                    } else {
                        p.pause(); // Met en pause
                        this.radios[n] = false; // Met à jour l'état pour afficher '▶'
                    }
                },

                // Charge les statistiques globales (totalHits, totalSongs) depuis l'API
                async loadStats() {
                    try {
                        const r = await axios.get('https://musica.zapto.org/api/stats', { withCredentials: true });
                        this.stats.totalHits = r.data.totalHits;
                        this.stats.totalSongs = r.data.totalSongs;
                        // Ne met pas à jour sessionPlayed ici car sa valeur dépend de la session fonctionnelle
                    } catch (e) {
                        console.error("Erreur lors du chargement des stats:", e);
                    }
                },

                // Incrémente le compteur global de clics (totalHits) via l'API
                async incrementHits() {
                    try {
                        await axios.post('https://musica.zapto.org/api/increment-hits', {}, { withCredentials: true });
                        // Après avoir incrémenté, on recharge les stats pour mettre à jour l'affichage de totalHits
                        await this.loadStats();
                    } catch (e) {
                        console.error("Erreur lors de l'incrémentation des hits:", e);
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
