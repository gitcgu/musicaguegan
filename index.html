<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Musica</title>
    <script src="https://unpkg.com/vue@3"></script>
    <script src="https://unpkg.com/axios"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lucida Sans', sans-serif; }
        .container {
            min-height: 100vh;
            padding: 20px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .song-title {
            font-size: 4em;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            max-width: 80%;
            word-wrap: break-word;
        }
        audio {
            width: 100%;
            max-width: 1200px;
            height: 100px;
            margin-top: 20px;
        }
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        /* --- STYLES POUR LES BOUTONS RONDS (PLAY/PAUSE, NEXT, PREV, REPLAY) --- */
        .btn {
            /* TAILLE DES BOUTONS MODIFIÉE COMME DEMANDÉ */
            width: 160px;  /* Largeur augmentée */
            height: 160px; /* Hauteur augmentée */
            
            display: flex;
            justify-content: center; /* Centre le symbole horizontalement */
            align-items: center;     /* Centre le symbole verticalement */
            border-radius: 50%; /* Rond */
            margin: 20px;  /* Espacement autour (augmenté) */
            border: 5px solid; /* Épaisseur de la bordure augmentée */
            border-color: inherit; /* Prend la couleur du texte, s'adapte dynamiquement */
            font-size: 64px;   /* Taille du symbole augmentée */
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease; /* Effet de transition doux */
            text-align: center;
        }
        .btn:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
        /* --- FIN DES STYLES POUR .btn --- */

        .section-title {
            font-size: 2.5em;
            margin: 40px 0 20px;
            width: 100%;
        }

        .radio-btn {
            font-size: 2em;
            padding: 20px 40px;
            margin: 10px auto; /* Centre horizontalement  */
            border-radius: 12px;
            cursor: pointer;
            display: block;
            border: 3px solid rgba(0,0,0,0.3);
            max-width: 80%;
        }

        .stats {
            margin-top: 40px;
            font-size: 1.2em;
            font-style: italic;
            width: 100%;
        }
        .stats p {
            color: black; /* Applique la couleur à la phrase */
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container" :style="{backgroundColor:bgColor, backgroundImage:bgImage, color:textColor}">
            <h1 class="song-title">{{songName}}</h1>
            <audio ref="player" :src="songUrl" controls @ended="handleSongEnd"></audio>

            <div class="section-title">M U $ I C</div>
            <div class="controls">
                <!-- Bouton Précédent -->
                <button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="previousSong">
                    &lt;&lt;
                </button>
                <!-- Bouton Play/Pause -->
                <button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="togglePlay">
                    {{ player.paused ? '▶' : '⏸' }}
                </button>
                <!-- Bouton Rejouer -->
                 <button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="replaySong">
                    ↻ <!-- Symbole de rejouer -->
                </button>
                <!-- Bouton Next -->
                <button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="handleNextClick">
                    &gt;&gt;
                </button>
            </div>

            <!-- Section Radio -->
            <div class="section-title">R A D I O</div>
            <div>
                <audio ref="radioFip" src="https://direct.fipradio.fr/live/fip-midfi.mp3"></audio>
                <button class="radio-btn" style="background-color:#2233FF;color:white" @click="toggleRadio('fip')">{{radios.fip?'⏸':'▶'}} FIP Radio</button>
            </div>
            <div>
                <audio ref="radioCulture" src="https://direct.franceculture.fr/live/franceculture-midfi.mp3"></audio>
                <button class="radio-btn" style="background-color:#F32;color:white" @click="toggleRadio('culture')">{{radios.culture?'⏸':'▶'}} France Culture</button>
            </div>

            <!-- Section Stats (uniquement la phrase) -->
            <div class="stats">
                <p>cé mizik an nou ki pli bel ®</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    songName: '',
                    songUrl: '', // URL de la chanson venant de l'API
                    bgColor: '#000',
                    textColor: '#FFF',
                    bgImage: '',
                    player: {
                        paused: true // État pour le bouton Play/Pause
                    },
                    radios: { fip: false, culture: false },
                    stats: { totalHits: 0, sessionPlayed: 0, totalSongs: 0 },

                    // --- HISTORIQUE DE LECTURE ---
                    playbackHistory: [], // Stocke les URLs des chansons jouées
                    currentHistoryIndex: -1 // Index de la chanson actuelle dans l'historique
                };
            },
            async mounted() {
                console.log("Composant monté. Chargement des stats, historique et première chanson...");
                await this.loadStats();
                // Charge les infos de la première chanson. La lecture sera déclenchée par le premier clic utilisateur.
                await this.nextSong(false); 
                console.log("Première chanson chargée. songUrl =", this.songUrl);
            },
            methods: {
                // Méthode pour charger la prochaine chanson
                async nextSong(increment = true) {
                    console.log("Appel à nextSong pour charger une NOUVELLE chanson...");
                    try {
                        const r = await axios.get('https://musica.zapto.org/api/next-song', { withCredentials: true });
                        console.log("Réponse API next-song:", r.data);
                        console.log("URL de la chanson reçue :", r.data.url);
                        console.log("URL de la cover reçue :", r.data.cover); // Log pour vérifier l'URL de la cover

                        this.songName = r.data.songName;
                        this.songUrl = r.data.url; 
                        this.bgColor = r.data.color;
                        this.textColor = r.data.textColor;
                        
                        // --- UTILISATION DIRECTE DE L'URL DE COVER ---
                        // On utilise l'URL de cover telle qu'elle est renvoyée par le backend, sans modification d'extension.
                        if (r.data.cover && typeof r.data.cover === 'string') {
                            this.bgImage = `url('${r.data.cover}')`; // Utilise directement l'URL reçue
                        } else {
                            this.bgImage = ''; // Pas de cover, fond vide
                        }
                        console.log("bgImage configuré à :", this.bgImage);

                        if (!this.songUrl) {
                            console.error("L'URL de la chanson est vide après l'appel API.");
                            alert("Aucune chanson chargée. Cliquez sur Next pour en charger une.");
                            return;
                        }

                        // --- GESTION DE L'HISTORIQUE ---
                        if (this.songUrl) {
                            this.playbackHistory.push(this.songUrl);
                            if (this.playbackHistory.length > 20) { // Limite l'historique
                                this.playbackHistory.shift();
                            }
                            this.currentHistoryIndex = this.playbackHistory.length - 1;
                            this.savePlaybackHistory();
                            console.log("Historique mis à jour et sauvegardé :", this.playbackHistory);
                        }
                        // --- FIN GESTION HISTORIQUE ---

                        this.player.paused = true; // Assure que le bouton affiche '▶'
                        if (increment) {
                            await this.loadStats();
                        }

                    } catch (e) {
                        console.error("Erreur dans nextSong lors du chargement:", e);
                        if (e.name === "NotSupportedError" || e.message.includes("no supported sources")) {
                            alert("Erreur de format audio ou fichier introuvable. Vérifiez que l'URL de la chanson est correcte et que le fichier est lisible.");
                        } else {
                            alert("Impossible de charger la prochaine chanson. Veuillez réessayer.");
                        }
                    }
                },
                
                // Gère le clic sur le bouton Play/Pause
                togglePlay() {
                    const p = this.$refs.player;

                    if (!this.songUrl) {
                        console.warn("songUrl est vide, on ne peut pas jouer.");
                        alert("Aucune chanson chargée. Cliquez sur Next pour en charger une.");
                        return;
                    }

                    console.log("Clic sur togglePlay. État actuel 'paused':", this.player.paused);

                    if (this.player.paused) { // Si actuellement en pause
                        console.log("Tentative de lecture...");
                        p.play()
                         .then(() => {
                             console.log("Lecture démarrée avec succès.");
                             this.player.paused = false; // Met à jour l'état pour afficher '⏸'
                             this.incrementHits(); 
                         })
                         .catch(e => {
                             console.error("Erreur lors de la lecture de la chanson:", e);
                             if (e.name === "NotSupportedError" || e.message.includes("no supported sources")) {
                                 alert("Erreur de format audio ou fichier introuvable. Vérifiez que l'URL de la chanson est correcte et que le fichier est lisible.");
                             } else {
                                 alert("Lecture audio non autorisée ou erreur de lecture. Essayez d'abord de cliquer sur Play.");
                             }
                         });
                    } else { // Si actuellement en lecture
                        console.console.log("Mise en pause...");
                        p.pause(); // Met en pause
                        this.player.paused = true; // Met à jour l'état pour afficher '▶'
                    }
                },
                
                // Gère le clic sur le bouton Next (appeler nextSong pour charger une NOUVELLE chanson)
                handleNextClick() {
                    console.log("Clic sur le bouton NEXT.");
                    this.nextSong(true); // true pour incrémenter les hits
                },

                // Gère l'événement @ended de l'audio (quand la chanson se termine)
                handleSongEnd() {
                    console.log("La chanson actuelle s'est terminée.");
                    // Passe automatiquement à la chanson suivante, sans incrémenter les hits
                    this.nextSong(false); 
                },

                // Méthode pour charger une chanson spécifique depuis l'historique
                async loadSongFromHistory(url) {
                    console.log("Chargement de la chanson depuis l'historique :", url);
                    this.songUrl = url;
                    // Pour l'instant, on ne peut pas récupérer dynamiquement le nom, couleurs, etc.
                    // Il faudrait une API backend pour ça. On met des valeurs par défaut.
                    this.songName = "Chanson historique"; 
                    this.bgColor = '#333'; // Couleur par défaut pour l'historique
                    this.textColor = '#EEE';
                    this.bgImage = '';

                    this.player.paused = true; // Met en pause pour que le clic Play fonctionne
                },

                // Gère le clic sur le bouton Précédent ( << )
                previousSong() {
                    console.log("Clic sur le bouton PRECEDENT.");
                    if (this.currentHistoryIndex > 0) {
                        this.currentHistoryIndex--; // Recule l'index
                        const previousUrl = this.playbackHistory[this.currentHistoryIndex];
                        this.loadSongFromHistory(previousUrl); // Charge la chanson
                        console.log("Chanson précédente chargée:", this.songUrl);
                    } else {
                        console.log("Pas de chanson précédente dans l'historique.");
                        alert("Pas de chanson précédente dans l'historique.");
                    }
                },
                 // Gère le clic sur le bouton Rejouer ( ↻ )
                replaySong() {
                    const p = this.$refs.player;
                    if (this.songUrl) { // S'assurer qu'une chanson est chargée
                        console.log("Rejouer la chanson actuelle.");
                        p.currentTime = 0; // Remet la lecture au début
                        p.play().then(() => {
                            this.player.paused = false; // Met à jour l'état pour afficher '⏸'
                            // Pas besoin d'incrémenter les hits pour une relecture
                        }).catch(e => {
                            console.error("Erreur lors de la relecture de la chanson:", e);
                             alert("Erreur lors de la relecture.");
                        });
                    } else {
                        console.warn("songUrl vide, impossible de rejouer.");
                        alert("Aucune chanson chargée pour rejouer.");
                    }
                },

                // Gère les radios
                toggleRadio(n) {
                    const refs = { fip: 'radioFip', culture: 'radioCulture' };
                    const p = this.$refs[refs[n]];

                    if (p.paused) {
                        p.play().then(() => {
                            this.radios[n] = true;
                        }).catch(e => {
                            console.error(`Erreur lors de la lecture de la radio ${n}:`, e);
                            alert(`Impossible de lire la radio ${n}.`);
                        });
                    } else {
                        p.pause();
                        this.radios[n] = false;
                    }
                },

                // Charge les statistiques globales (totalHits, totalSongs)
                async loadStats() {
                    try {
                        const r = await axios.get('https://musica.zapto.org/api/stats', { withCredentials: true });
                        this.stats.totalHits = r.data.totalHits;
                        this.stats.totalSongs = r.data.totalSongs;
                    } catch (e) {
                        console.error("Erreur lors du chargement des stats:", e);
                    }
                },

                // Incrémente le compteur global de clics (totalHits) via l'API
                async incrementHits() {
                    try {
                        await axios.post('https://musica.zapto.org/api/increment-hits', {}, { withCredentials: true });
                        await this.loadStats(); // Recharge pour mettre à jour l'affichage de totalHits
                    } catch (e) {
                        console.error("Erreur lors de l'incrémentation des hits:", e);
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
