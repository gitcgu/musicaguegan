<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Musica</title><script src="https://unpkg.com/vue@3"></script><script src="https://unpkg.com/axios"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Lucida Sans',sans-serif}.container{min-height:100vh;padding:20px;background-size:cover;background-position:center}.song-title{font-size:4em;margin:20px 0;text-shadow:2px 2px 4px rgba(0,0,0,0.5)}audio{width:100%;max-width:1200px;height:100px}.btn{font-size:50px;padding:45px 60px;margin:10px;border:3px solid;border-radius:12px;cursor:pointer;font-weight:bold}.section-title{font-size:2.5em;margin:40px 0 20px}.radio-btn{font-size:2em;padding:20px 40px;margin:10px 0;border-radius:12px;cursor:pointer;display:block;margin-left:125px;border:3px solid rgba(0,0,0,0.3)}.stats{margin-top:40px;font-size:1.2em;font-style:italic}</style></head><body><div id="app"><div class="container" :style="{backgroundColor:bgColor,backgroundImage:bgImage,color:textColor}"><h1 class="song-title">{{songName}}</h1><audio ref="player" :src="songUrl" controls autoplay @ended="nextSong"></audio><div class="section-title">M U $ I C</div><div class="controls"><button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="togglePlay">Play/Pause</button><button class="btn" :style="{backgroundColor:textColor,color:bgColor}" @click="nextSong">NEXT &gt;&gt;</button></div><div class="section-title">R A D I O</div><div><audio ref="radioFip" src="https://direct.fipradio.fr/live/fip-midfi.mp3"></audio><button class="radio-btn" style="background-color:#2233FF;color:white" @click="toggleRadio('fip')">{{radios.fip?'⏸':'▶'}} FIP Radio</button></div><div><audio ref="radioCulture" src="https://direct.franceculture.fr/live/franceculture-midfi.mp3"></audio><button class="radio-btn" style="background-color:#F32;color:white" @click="toggleRadio('culture')">{{radios.culture?'⏸':'▶'}} France Culture</button></div><div class="stats"><p><p style="color:black">cé mizik an nou ki pli bel ®</p></div></div></div><script>const{createApp}=Vue;createApp({data(){return{songName:'',songUrl:'',bgColor:'#000',textColor:'#FFF',bgImage:'',radios:{fip:false,culture:false},stats:{totalHits:0,sessionPlayed:0,totalSongs:0}}},async mounted(){await this.loadStats();await this.nextSong();await this.incrementHits()},methods:{async nextSong(){try{const r=await axios.get('https://musica.zapto.org/api/next-song',{withCredentials:true});this.songName=r.data.songName;this.songUrl=r.data.url;this.bgColor=r.data.color;this.textColor=r.data.textColor;this.bgImage=`url('${r.data.cover}')`;setTimeout(()=>this.$refs.player.play(),100);await this.loadStats()}catch(e){console.error(e)}},togglePlay(){const p=this.$refs.player;p.paused?p.play():p.pause()},toggleRadio(n){const refs={fip:'radioFip',culture:'radioCulture'};const p=this.$refs[refs[n]];if(p.paused){p.play();this.radios[n]=true}else{p.pause();this.radios[n]=false}},async loadStats(){try{const r=await axios.get('https://musica.zapto.org/api/stats',{withCredentials:true});this.stats=r.data}catch(e){}},async incrementHits(){try{await axios.post('https://musica.zapto.org/api/increment-hits',{},{withCredentials:true})}catch(e){}}}}).mount('#app')</script></body></html>
